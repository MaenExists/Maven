<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAVEN // Geospatial Intelligence Globe</title>
    <!-- CesiumJS CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css">
    <link rel="stylesheet" href="css/globe.css">
    <!-- CesiumJS Script -->
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
    <!-- Qt WebChannel (if loaded within PySide6 / QWebEngineView) -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
    <!-- 3D WebGL Globe Container -->
    <div id="cesiumContainer"></div>

    <!-- Adversarial Atmospheric Vignette & Scanlines -->
    <div class="vignette-overlay"></div>
    <div class="scanlines-overlay"></div>
    <div class="reticle-center"></div>

    <!-- Top Left Tactical Sensor Badges -->
    <div style="position: absolute; top: 18px; left: 20px; z-index: 10; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: center; gap: 8px; background: rgba(6,10,18,0.85); padding: 5px 12px; border: 1px solid rgba(0,240,255,0.3); border-radius: 3px; font-size: 11px;">
            <div style="width: 7px; height: 7px; background: #00f0ff; border-radius: 50%; box-shadow: 0 0 8px #00f0ff;"></div>
            <span style="color: #64748b;">FLIGHTS:</span>
            <span id="countFlights" style="color: #00f0ff; font-weight: 800;">--</span>
            <span style="color: #64748b; margin-left: 6px;">VESSELS:</span>
            <span id="countVessels" style="color: #10b981; font-weight: 800;">--</span>
            <span style="color: #64748b; margin-left: 6px;">FIRES:</span>
            <span id="countFires" style="color: #ff4500; font-weight: 800;">--</span>
            <span style="color: #64748b; margin-left: 6px;">CAMS:</span>
            <span id="countCams" style="color: #38bdf8; font-weight: 800;">--</span>
            <span style="color: #64748b; margin-left: 6px;">THREATS:</span>
            <span id="countAnomalies" style="color: #ff0055; font-weight: 800;">--</span>
        </div>
    </div>

    <!-- Top Right Operational Action Tool Dock -->
    <div class="hud-dock-tools">
        <button id="btnBasemap" class="hud-btn" onclick="const mode = window.mavenApp.cycleBasemap(); document.getElementById('lblBasemap').textContent = mode.toUpperCase();">
            <span>🌍</span> <span id="lblBasemap">SATELLITE</span>
        </button>
        <button class="hud-btn" onclick="window.mavenApp.toggleSunLighting()">
            <span>☀️</span> SUN LIGHT
        </button>
        <button class="hud-btn" onclick="window.mavenApp.toggle3DBuildings()">
            <span>🏙️</span> 3D TILES
        </button>
        <button class="hud-btn" onclick="window.mavenApp.geofenceDrawer.startDrawing()">
            <span>🛡️</span> DRAW ZONE
        </button>
        <button class="hud-btn" onclick="window.mavenApp.measureTool.setMode('distance')">
            <span>📏</span> RULER
        </button>
        <button class="hud-btn" onclick="window.mavenApp.measureTool.setMode('area')">
            <span>📐</span> AREA
        </button>
        <button class="hud-btn" onclick="window.mavenApp.changeViewer.loadPreset('diff-port-singapore')">
            <span>🛰️</span> SAT DIFF
        </button>
        <button class="hud-btn btn-alert" onclick="window.mavenApp.flyTo(103.80, 1.25, 45000)">
            <span>🎯</span> CHOKEPOINT
        </button>
    </div>

    <!-- Live Telemetry Readout (Bottom Left) -->
    <div class="hud-telemetry-bar">
        <div class="hud-item"><span>COORD:</span><b id="hudCoords">25.0000° N, 15.0000° E</b></div>
        <div class="hud-item"><span>ALT:</span><b id="hudAlt">22000 KM</b></div>
        <div class="hud-item"><span>HDG:</span><b id="hudHeading">0°</b></div>
        <div class="hud-item"><span>ENGINE:</span><b style="color: #10b981;">ONLINE</b></div>
    </div>

    <!-- Live Surveillance Feed Modal -->
    <div id="cameraModal" class="tactical-modal-backdrop">
        <div class="tactical-modal">
            <div class="modal-header">
                <div class="modal-title">LIVE SURVEILLANCE FEED // CLASSIFIED</div>
                <button class="modal-close" onclick="window.mavenApp.closeCameraModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="cam-preview-frame">
                    <div class="cam-rec-indicator">
                        <div class="cam-rec-dot"></div>
                        <span>LIVE</span>
                    </div>
                    <img id="modalCamImg" class="cam-preview-img" src="" alt="Surveillance Stream">
                </div>
                <div class="cam-meta-grid">
                    <div class="cam-meta-row">
                        <span class="cam-meta-label">UNIT ID:</span>
                        <span id="modalCamTitle" class="cam-meta-value">TfL-CAM-808</span>
                    </div>
                    <div class="cam-meta-row">
                        <span class="cam-meta-label">SECTOR:</span>
                        <span id="modalCamLoc" class="cam-meta-value">Greater London, UK</span>
                    </div>
                    <div class="cam-meta-row">
                        <span class="cam-meta-label">GEODETIC:</span>
                        <span id="modalCamCoords" class="cam-meta-value">51.5074, -0.1278</span>
                    </div>
                    <div class="cam-meta-row">
                        <span class="cam-meta-label">STATUS:</span>
                        <span class="cam-meta-value" style="color: #10b981;">TRANSMITTING</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Core Scripts -->
    <script src="js/sound.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/geofence_draw.js"></script>
    <script src="js/measurements.js"></script>
    <script src="js/change_detect.js"></script>
    <script src="js/weather_layer.js"></script>
    <script src="js/globe_app.js"></script>
</body>
</html>
